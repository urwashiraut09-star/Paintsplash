<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Form</title>
    <style>
        /* General body styling */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Use min-height to allow content to grow */
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #fce4ec, #e0f7fa); /* A soft gradient background */
        }

        /* Container for the register form */
        .register-container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            background: linear-gradient(180deg, #fff0f5, #f8f8f8); /* Light pink to white gradient for the form box */
        }

        /* Styling for form groups (label + input) */
        .form-group {
            margin-bottom: 22px; /* Slightly more space between groups */
        }
        
        /* Label styling */
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 15px;
        }

        /* Input field styling */
        .form-group input {
            width: 100%;
            padding: 13px 18px; /* Slightly more padding */
            border: 1px solid #eee; /* Lighter border */
            border-radius: 9px; /* Slightly more rounded corners */
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
            background-color: #fff; /* Ensure input background is white */
        }

        /* Style for placeholder text */
        .form-group input::placeholder {
            color: #ccc; /* Lighter placeholder color */
        }

        /* Focus style for input fields */
        .form-group input:focus {
            outline: none;
            border-color: #f8a4dc; /* Pinker focus border */
            box-shadow: 0 0 0 3px rgba(248, 164, 220, 0.2); /* Soft pink glow */
        }
        
        /* Register button styling */
        .register-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 28px; /* More rounded pill shape */
            background: linear-gradient(90deg, #a060ff, #f857a6);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15); /* Soft shadow for the button */
        }

        .register-btn:hover {
            transform: translateY(-2px); /* Slight lift effect */
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

    <div class="register-container">
        <form>
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Value">
            </div>
            <div class="form-group">
                <label for="surname">Surname</label>
                <input type="text" id="surname" name="surname" placeholder="Value">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Value">
            </div>
            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" name="mobile" placeholder="Value">
            </div>
            <button type="submit" class="register-btn">Register</button>
        </form>
    </div>

</body>
</html>
